[workspace]
members = ["server", "shared", "web"]
default-members = ["server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
paracord-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimise dependencies even in debug builds; otherwise password hashing
# alone takes seconds per sign-in.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
# "debuginfo", not true: full stripping also removes the WebAssembly
# target_features section, and then wasm-bindgen/wasm-opt can't tell which
# features the web client uses (wasm-opt fails on newer Rust).
strip = "debuginfo"

# The site ships to every browser, so favour a small download over raw speed.
[profile.release.package.paracord-web]
opt-level = "z"
