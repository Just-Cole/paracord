<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Paracord: a place to build a community." />
    <title>Paracord</title>
    <link data-trunk rel="icon" href="favicon.svg" />
    <link data-trunk rel="css" href="style.css" />
    <!-- Rust emits these WebAssembly features by default (all browsers since
         2021 support them); wasm-opt must be told it may keep them. -->
    <link
      data-trunk
      rel="rust"
      data-bin="paracord-web"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
  </head>
  <body></body>
</html>
